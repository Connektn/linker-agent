# Base URL for Connektn CDP (used by heartbeat and command polling)
cdpBaseUrl: "https://api.connektn.io"

server:
  addr: ":8080"

privacy:
  mode: "strict"
  tenantSalt: "env:TENANT_SALT"

agent:
  organizationId: "env:ORGANIZATION_ID"  # Your Connektn organization ID
  version: "1.0.0"

heartbeat:
  enabled: true
  interval: 30s
  signatureSecret: "env:HEARTBEAT_SECRET"

# Command polling (agent polls CDP for control commands)
commandPolling:
  enabled: true
  interval: 30s
  signatureSecret: "env:CONTROL_SECRET"
  maxClockSkew: 5m
  timeout: 10s

sources:
  stripe:
    apiKey: "env:STRIPE_API_KEY"
    account: ""
    maxRequestsPerSecond: 8

    webhook:
      enabled: true
      path: "/webhooks/stripe"
      signingSecret: "env:STRIPE_WEBHOOK_SECRET"
      maxSkew: 300s
      retry:
        maxAttempts: 5
        baseBackoff: 2s
        maxBackoff: 30s

export:
  mode: "file"  # "http", "file", or "both"

  # Per-stream HTTP configuration (used when mode is "http" or "both")
  http:
    baseUrl: "https://api.connektn.io"
    routes:
      edges: "/ingest/edges"
      billing: "/ingest/billing"
      usage: "/ingest/usage"
    headers:
      authorizationEnv: "CONNEKTN_TENANT_KEY"  # Optional: env var name for Bearer token
    maxRetries: 3
    batchSize: 50
    flushEvery: 5s

  # Per-stream file configuration (used when mode is "file" or "both")
  file:
    paths:
      edges: "reports/link_edges.jsonl"
      billing: "reports/billing.jsonl"
      usage: "reports/usage.jsonl"

matchers:
  recipe:
    name: "default"
    version: "v1"
    weights:
      deterministic_id: 1.0
      temporal_proximity: 0.5
      sku_overlap: 0.8
    threshold: 0.8
    temporalWindowSec: 3600   # 1 hour
    skuOverlapMin: 0.5

# Durable queue configuration (ensures zero data loss during outages/restarts)
queue:
  type: "durable"  # "memory" (legacy, in-memory only) or "durable" (disk-backed with WAL)
  walPath: "/var/lib/connektn/wal"  # Directory for BadgerDB queue storage

  # Billing queue (Stripe events) - never lose billing data
  billing:
    maxBytes: 5368709120      # 5GB max disk usage
    maxEvents: 1000000        # 1M events max
    dropPolicy: "reject_new"  # Return 503 to Stripe when full (Stripe will retry)
    segmentSize: 104857600    # 100MB per segment (not used in BadgerDB)

  # Usage queue (feature/analytics events)
  usage:
    maxBytes: 2147483648      # 2GB max
    maxEvents: 5000000        # 5M events max
    dropPolicy: "drop_oldest" # OK to lose old metrics-like data
    segmentSize: 104857600

  # Edges queue (identity link edges)
  edges:
    maxBytes: 1073741824      # 1GB max
    maxEvents: 500000
    dropPolicy: "drop_oldest"
    segmentSize: 104857600

  # Dead Letter Queue (poison/invalid events)
  dlq:
    maxBytes: 536870912       # 500MB max
    retentionDays: 7          # Auto-cleanup after 7 days
