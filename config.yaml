server:
  addr: ":8080"

privacy:
  mode: "strict"
  tenantSalt: "env:TENANT_SALT"

sources:
  stripe:
    apiKey: "env:STRIPE_API_KEY"
    account: ""
    maxRequestsPerSecond: 8

export:
  mode: "file"  # "http", "file", or "both"

  # Per-stream HTTP configuration (used when mode is "http" or "both")
  http:
    baseUrl: "https://api.connektn.io"
    routes:
      edges: "/ingest/edges"
      billing: "/ingest/billing"
      usage: "/ingest/usage"
    headers:
      authorizationEnv: "CONNEKTN_TENANT_KEY"  # Optional: env var name for Bearer token
    maxRetries: 3
    batchSize: 50
    flushEvery: 5s

  # Per-stream file configuration (used when mode is "file" or "both")
  file:
    paths:
      edges: "reports/link_edges.jsonl"
      billing: "reports/billing.jsonl"
      usage: "reports/usage.jsonl"

matchers:
  recipe:
    name: "default"
    version: "v1"
    weights:
      deterministic_id: 1.0
      temporal_proximity: 0.5
      sku_overlap: 0.8
    threshold: 0.8
    temporalWindowSec: 3600   # 1 hour
    skuOverlapMin: 0.5
