{{- if eq .Values.type "nginx" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "connektn-gateway.fullname" . }}
  labels:
    {{- include "connektn-gateway.labels" . | nindent 4 }}
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        {{- if eq .Values.config.accessLog.format "json" }}
        log_format json_combined escape=json
          '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr"'
          '}';
        access_log /var/log/nginx/access.log json_combined;
        {{- else }}
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
        access_log /var/log/nginx/access.log main;
        {{- end }}

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        client_max_body_size {{ .Values.nginx.clientMaxBodySize }};
        client_body_temp_path /tmp/client_body;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        {{- if .Values.config.rateLimit.enabled }}
        # Rate limiting zone
        limit_req_zone $binary_remote_addr zone=connektn_limit:10m rate={{ .Values.config.rateLimit.requestsPerSecond }}r/s;
        limit_req_status 429;
        {{- end }}

        upstream connektn_agent {
            server {{ include "connektn-gateway.upstreamService" . }}:{{ .Values.config.upstream.port }};
            keepalive 32;
        }

        server {
            {{- if .Values.config.tls.enabled }}
            listen 443 ssl http2;
            {{- else }}
            listen 8080;
            {{- end }}
            server_name _;

            {{- if .Values.config.tls.enabled }}
            # TLS configuration
            ssl_certificate /etc/nginx/certs/tls.crt;
            ssl_certificate_key /etc/nginx/certs/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers HIGH:!aNULL:!MD5;
            ssl_prefer_server_ciphers on;
            ssl_session_cache shared:SSL:10m;
            ssl_session_timeout 10m;

            {{- if .Values.config.tls.clientCertRequired }}
            # mTLS configuration
            ssl_client_certificate /etc/nginx/certs/ca.crt;
            ssl_verify_client on;
            {{- end }}
            {{- end }}

            {{- if .Values.config.rateLimit.enabled }}
            # Apply rate limiting to webhook endpoint
            location {{ .Values.config.routes.webhook.path }} {
                limit_req zone=connektn_limit burst={{ .Values.config.rateLimit.burst }};

                proxy_pass http://connektn_agent;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Connection "";

                proxy_connect_timeout {{ .Values.nginx.proxyConnectTimeout }};
                proxy_read_timeout {{ .Values.nginx.proxyReadTimeout }};
                proxy_send_timeout {{ .Values.nginx.proxySendTimeout }};
            }
            {{- end }}

            # Health check endpoints (no rate limiting)
            location {{ .Values.config.routes.healthz.path }} {
                proxy_pass http://connektn_agent;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                access_log off;
            }

            location {{ .Values.config.routes.readyz.path }} {
                proxy_pass http://connektn_agent;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                access_log off;
            }

            # Metrics endpoint
            location {{ .Values.config.routes.metrics.path }} {
                proxy_pass http://connektn_agent;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
            }

            # Default location (catch-all)
            location / {
                return 404;
            }
        }
    }
{{- end }}
