apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "connektn-gateway.fullname" . }}
  labels:
    {{- include "connektn-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "connektn-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "connektn-gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "connektn-gateway.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      {{- if eq .Values.type "nginx" }}
      - name: nginx
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.image.nginx.repository }}:{{ .Values.image.nginx.tag }}"
        imagePullPolicy: {{ .Values.image.nginx.pullPolicy }}
        ports:
        - name: https
          containerPort: {{ if .Values.config.tls.enabled }}443{{ else }}8080{{ end }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            {{- if .Values.config.tls.enabled }}
            scheme: HTTPS
            {{- else }}
            scheme: HTTP
            {{- end }}
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: https
            {{- if .Values.config.tls.enabled }}
            scheme: HTTPS
            {{- else }}
            scheme: HTTP
            {{- end }}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        {{- if .Values.config.tls.enabled }}
        - name: tls-certs
          mountPath: /etc/nginx/certs
          readOnly: true
        {{- end }}
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run
        - name: tmp
          mountPath: /tmp
        - name: log
          mountPath: /var/log/nginx
      {{- else if eq .Values.type "envoy" }}
      - name: envoy
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.image.envoy.repository }}:{{ .Values.image.envoy.tag }}"
        imagePullPolicy: {{ .Values.image.envoy.pullPolicy }}
        ports:
        - name: https
          containerPort: 443
          protocol: TCP
        - name: admin
          containerPort: {{ .Values.envoy.admin.port }}
          protocol: TCP
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        # TODO: Add Envoy configuration in Phase 2
      {{- end }}
      volumes:
      - name: config
        configMap:
          name: {{ include "connektn-gateway.fullname" . }}
      {{- if .Values.config.tls.enabled }}
      - name: tls-certs
        secret:
          secretName: {{ .Values.config.tls.existingSecret | default (printf "%s-tls" (include "connektn-gateway.fullname" .)) }}
      {{- end }}
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: log
        emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
