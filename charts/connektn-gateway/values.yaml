# Default values for connektn-gateway
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Gateway type: "nginx" or "envoy"
type: nginx

replicaCount: 2

image:
  # NGINX image
  nginx:
    repository: nginx
    tag: "1.25-alpine"
    pullPolicy: IfNotPresent
  # Envoy image (for future use)
  envoy:
    repository: envoyproxy/envoy
    tag: "v1.28-latest"
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101  # nginx user
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE  # Allow binding to ports < 1024
  readOnlyRootFilesystem: true

service:
  type: LoadBalancer
  port: 443
  annotations: {}
    # service.beta.kubernetes.io/aws-load-balancer-type: nlb
    # service.beta.kubernetes.io/aws-load-balancer-scheme: internal

# Ingress for Gateway (optional, usually Gateway is exposed via LoadBalancer)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: gateway.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: connektn-gateway
        topologyKey: kubernetes.io/hostname

# Gateway configuration
config:
  # Upstream backend (Connektn Agent service)
  upstream:
    # Name of the agent service
    serviceName: connektn-agent
    # Port of the agent service
    port: 8080
    # Namespace (leave empty to use same namespace)
    namespace: ""

  # TLS/mTLS configuration
  tls:
    enabled: true
    # Require client certificates (mTLS)
    clientCertRequired: false
    # Use existing secret for server certificates
    existingSecret: ""
    # Use cert-manager for certificate generation
    certManager:
      enabled: false
      issuerRef:
        name: connektn-issuer
        kind: ClusterIssuer

  # Routing rules
  routes:
    # Webhook path (routes to agent)
    webhook:
      path: /webhooks/stripe
      stripPath: false
    # Health check paths
    healthz:
      path: /healthz
      stripPath: false
    readyz:
      path: /readyz
      stripPath: false
    # Metrics path
    metrics:
      path: /metrics
      stripPath: false

  # Rate limiting (requests per second per IP)
  rateLimit:
    enabled: true
    requestsPerSecond: 10
    burst: 20

  # Access logging
  accessLog:
    enabled: true
    format: json

# NGINX-specific configuration
nginx:
  # Custom nginx.conf (optional)
  customConfig: ""
  # Client body size limit
  clientMaxBodySize: 1m
  # Proxy timeouts
  proxyConnectTimeout: 60s
  proxyReadTimeout: 60s
  proxySendTimeout: 60s

# Envoy-specific configuration (for future use)
envoy:
  # Admin interface
  admin:
    enabled: true
    port: 9901
  # Custom envoy.yaml (optional)
  customConfig: ""

# Service monitor for Prometheus (requires prometheus-operator)
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
