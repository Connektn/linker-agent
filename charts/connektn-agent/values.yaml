# Default values for connektn-agent
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Deployment profile: "lite" or "ha"
# lite: Single-agent pod with embedded WAL queue (PVC attached)
# ha: Multi-agent deployment using Kafka/Rabbit backend with consumer groups
profile: lite

replicaCount: 1

image:
  repository: ghcr.io/connektn/linker-agent
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Agent operation mode: "webhook" (recommended for K8s)
# webhook: Run as HTTP server listening for Stripe webhooks
# matcher: Run matcher pipeline once (for batch jobs)
# export-billing: Export billing data only (for batch jobs)
mode: webhook

# Service account configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
  controlPort: 8081
  annotations: {}

# Ingress configuration (optional)
ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: linker.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: linker-tls
  #    hosts:
  #      - linker.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Autoscaling configuration (HA profile only)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Node selector for pod assignment
nodeSelector: {}

# Tolerations for pod assignment
tolerations: []

# Affinity rules for pod assignment
affinity: {}

# Liveness probe configuration
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Persistence configuration for Lite profile (embedded WAL queue)
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  # Existing claim to use (optional)
  existingClaim: ""
  # Mount path for WAL storage
  mountPath: /var/lib/connektn/wal

# Agent configuration
config:
  # CDP Base URL (used by heartbeat and command polling)
  cdpBaseUrl: "https://api.connektn.io"

  # Agent identity
  agent:
    # Agent ID will be auto-generated and persisted if not specified
    id: ""
    # Organization ID (required, loaded from secret)
    organizationId: ""
    version: ""  # Defaults to chart appVersion

  # Server configuration
  server:
    addr: ":8080"

  # Heartbeat configuration
  heartbeat:
    enabled: true
    interval: 30s
    # endpoint: "https://api.connektn.io/agent/heartbeat"  # DEPRECATED: Use cdpBaseUrl instead
    # signatureSecret will be loaded from secret

  # Command polling configuration (agent polls CDP for commands)
  commandPolling:
    enabled: true
    interval: 30s
    # signatureSecret will be loaded from secret
    maxClockSkew: 300s  # 5 minutes
    timeout: 10s

  # Privacy configuration
  privacy:
    mode: "strict"  # strict | standard
    idMode: "strict"  # strict | passthrough
    # tenantSalt will be loaded from secret
    allowPassthroughExports: false

  # Stripe source configuration
  sources:
    stripe:
      # apiKey will be loaded from secret
      account: ""
      maxRequestsPerSecond: 8
      webhook:
        enabled: true
        path: "/webhooks/stripe"
        # signingSecret will be loaded from secret
        maxSkew: 300s
        retry:
          maxAttempts: 5
          baseBackoff: 2s
          maxBackoff: 30s

  # Export configuration
  export:
    mode: "http"  # http | file | both
    http:
      baseUrl: "https://api.connektn.io"
      routes:
        edges: "/ingest/edges"
        billing: "/ingest/billing"
        usage: "/ingest/usage"
      maxRetries: 3
      batchSize: 50
      flushEvery: 5s
    file:
      paths:
        edges: "/var/lib/connektn/wal/link_edges.jsonl"
        billing: "/var/lib/connektn/wal/billing.jsonl"
        usage: "/var/lib/connektn/wal/usage.jsonl"

  # Matcher configuration
  matchers:
    recipe:
      name: "default"
      version: "v1"
      weights:
        deterministic_id: 1.0
        temporal_proximity: 0.5
        sku_overlap: 0.8
      threshold: 0.8
      temporalWindowSec: 3600
      skuOverlapMin: 0.5

# Secrets configuration
# These values should be provided via external secrets or sealed secrets
secrets:
  # Stripe API key (required)
  stripeApiKey: ""
  # Stripe webhook signing secret (required for webhook mode)
  stripeWebhookSecret: ""
  # Tenant salt for synthetic ID generation (required)
  tenantSalt: ""
  # Organization ID (required)
  organizationId: ""
  # Heartbeat signature secret (required if heartbeat enabled)
  heartbeatSecret: ""
  # Control command signature secret (required if control enabled)
  controlSecret: ""
  # Connektn tenant API key (optional, for HTTP export)
  connektnTenantKey: ""
  # Use existing secret instead of creating one
  existingSecret: ""

# HA profile configuration (Kafka/RabbitMQ)
queue:
  # Queue type: "embedded" (Lite) or "kafka" or "rabbitmq" (HA)
  type: embedded

  # Kafka configuration (for HA profile)
  kafka:
    # Kafka bootstrap servers
    brokers: []
    # Topic configuration
    topics:
      events: "connektn-events"
      dlq: "connektn-dlq"
    # Consumer group ID
    consumerGroup: "connektn-agents"
    # SASL configuration
    sasl:
      enabled: false
      mechanism: "PLAIN"
      username: ""
      password: ""
    # TLS configuration
    tls:
      enabled: false
      # Use existing secret for certificates
      existingSecret: ""

  # RabbitMQ configuration (for HA profile)
  rabbitmq:
    # RabbitMQ host
    host: ""
    # RabbitMQ port
    port: 5672
    # Queue names
    queues:
      events: "connektn-events"
      dlq: "connektn-dlq"
    # Exchange configuration
    exchange:
      name: "connektn"
      type: "topic"
    # Auth configuration
    auth:
      username: ""
      password: ""
      existingSecret: ""
    # TLS configuration
    tls:
      enabled: false
      existingSecret: ""

# mTLS configuration for inter-component communication
mtls:
  enabled: false
  # Use cert-manager for certificate generation
  certManager:
    enabled: false
    issuerRef:
      name: connektn-issuer
      kind: ClusterIssuer
  # Or use existing certificates
  existingSecret: ""

# Service monitor for Prometheus (requires prometheus-operator)
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
